---
- name: Require a release tag
  ansible.builtin.assert:
    that:
      - git_ref | default('') | length > 0
    fail_msg: "Set git_ref to the release tag on the host in the inventory, for example git_ref: v1.2.3."

- name: Require init or update
  ansible.builtin.assert:
    that:
      - deploy_action in ['init', 'update']
      - deploy_path is match('^/')
    fail_msg: "deploy_action must be 'init' or 'update', and deploy_path must be absolute."

- name: Check the deploy parent directory
  ansible.builtin.stat:
    path: "{{ deploy_path | dirname }}"
  register: deploy_parent

- name: Create the deploy parent directory
  ansible.builtin.file:
    path: "{{ deploy_path | dirname }}"
    state: directory
    mode: "0755"
  when: not deploy_parent.stat.exists

- name: Update application checkout
  ansible.builtin.git:
    repo: "{{ git_repo }}"
    dest: "{{ deploy_path }}"
    version: "{{ git_ref }}"
    update: true

- name: Check that prod env files exist
  ansible.builtin.stat:
    path: "{{ deploy_path }}/{{ item }}"
  loop: "{{ required_env_files }}"
  register: prod_env_files

- name: Stop when a prod env file is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      {{ deploy_path }}/{{ item.item }} is missing.
      Restore the prod env files from KeePass into the checkout.
      This playbook does not create, template, or copy them.
  loop: "{{ prod_env_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require app_domain
  ansible.builtin.assert:
    that:
      - app_domain | default('') | length > 0
      - app_domain is match('^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$')
      - "'.' in app_domain"
      - traefik_network is match('^[A-Za-z0-9_.-]*$')
      - traefik_entrypoint is match('^[A-Za-z0-9_.-]*$')
    fail_msg: >-
      Set app_domain on the host to the public hostname Traefik routes,
      for example bedarf.example.org. The playbook writes that value to .env
      as APP_DOMAIN. traefik_network and traefik_entrypoint are optional and
      must be single tokens when set.

- name: Install .env from inventory host vars
  ansible.builtin.template:
    src: dotenv.j2
    dest: "{{ deploy_path }}/.env"
    mode: "0644"

- name: Record whether offsite backup is configured
  ansible.builtin.set_fact:
    offsite_backup_configured: "{{ ((backup_age_recipient | default('') | length > 0) and (backup_nextcloud_webdav_url | default('') | length > 0) and (backup_nextcloud_share_token | default('') | length > 0)) | bool }}"

- name: Require complete offsite backup settings
  ansible.builtin.assert:
    that:
      - backup_age_recipient | default('') | length > 0
      - backup_nextcloud_webdav_url | default('') | length > 0
      - backup_nextcloud_share_token | default('') | length > 0
      - backup_age_recipient is match('^age1[0-9a-z]+$')
      - backup_nextcloud_webdav_url is match('^https://')
      - backup_nextcloud_webdav_url == (backup_nextcloud_webdav_url | regex_replace('\s', ''))
      - backup_nextcloud_share_token == (backup_nextcloud_share_token | regex_replace('\n', ''))
      - backup_nextcloud_share_password == (backup_nextcloud_share_password | regex_replace('\n', ''))
      - backup_offsite_extra_files == (backup_offsite_extra_files | regex_replace('\n', ''))
    fail_msg: >-
      Set backup_age_recipient, backup_nextcloud_webdav_url, and
      backup_nextcloud_share_token on the host. The recipient is the age public
      key (age1...), and the WebDAV URL must start with https://.
      Omit all three to leave offsite backup unconfigured.
  when: >-
    (backup_age_recipient | default('') | length > 0)
    or (backup_nextcloud_webdav_url | default('') | length > 0)
    or (backup_nextcloud_share_token | default('') | length > 0)

- name: Install env-backup.env from inventory host vars
  ansible.builtin.template:
    src: env-backup.env.j2
    dest: "{{ deploy_path }}/env-backup.env"
    mode: "0600"
  when: offsite_backup_configured | bool

- name: Check that docker compose is available
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false

- name: Check whether the database container exists
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - -a
      - -q
      - db
    chdir: "{{ deploy_path }}"
  register: db_container_id
  changed_when: false
  failed_when: false

- name: Use init when update has no database to back up
  ansible.builtin.set_fact:
    deploy_action_effective: "{{ 'init' if (deploy_action == 'update' and not (db_container_id.stdout | trim)) else deploy_action }}"

- name: Note the first-deploy fallback
  ansible.builtin.debug:
    msg: >-
      No database container in {{ deploy_path }}; using deploy_action=init
      instead of update (nothing to back up yet).
  when: deploy_action_effective != deploy_action

- name: Build application images
  ansible.builtin.command:
    argv:
      - ./dev/build/build-and-deploy.bash
      - "{{ deploy_action_effective }}"
    chdir: "{{ deploy_path }}"

- name: Require the Traefik Compose override
  ansible.builtin.stat:
    path: "{{ deploy_path }}/compose.traefik.yaml"
  register: traefik_compose_file

- name: Stop when compose.traefik.yaml is missing
  ansible.builtin.assert:
    that:
      - traefik_compose_file.stat.exists
    fail_msg: >-
      {{ deploy_path }}/compose.traefik.yaml is missing.
      Deploy a git_ref that includes that file.

- name: Start the Compose stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - compose.yaml
      - -f
      - compose.traefik.yaml
      - up
      - -d
    chdir: "{{ deploy_path }}"

- name: Schedule the database backup
  ansible.builtin.cron:
    name: solawi-bedarf database backup
    minute: "{{ backup_cron_minute }}"
    hour: "{{ backup_cron_hour }}"
    job: "{{ deploy_path }}/dev/backup/database-backup.bash"

- name: Schedule database backup cleanup
  ansible.builtin.cron:
    name: solawi-bedarf database backup cleanup
    minute: "{{ cleanup_cron_minute }}"
    hour: "{{ cleanup_cron_hour }}"
    job: "{{ deploy_path }}/dev/backup/database-clean-backups.bash"

- name: Schedule the offsite backup
  ansible.builtin.cron:
    name: solawi-bedarf offsite backup
    minute: "{{ offsite_cron_minute }}"
    hour: "{{ offsite_cron_hour }}"
    job: "{{ deploy_path }}/dev/backup/offsite-backup.bash"
  when: offsite_backup_configured | bool

- name: Remove the offsite backup cron job
  ansible.builtin.cron:
    name: solawi-bedarf offsite backup
    state: absent
  when: not (offsite_backup_configured | bool)
