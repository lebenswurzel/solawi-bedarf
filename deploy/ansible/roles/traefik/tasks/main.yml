---
- name: Require an absolute Traefik path
  ansible.builtin.assert:
    that:
      - traefik_path is match('^/')
    fail_msg: "traefik_path must be absolute."

- name: Ensure the Traefik directory exists
  ansible.builtin.file:
    path: "{{ traefik_path }}"
    state: directory
    mode: "0755"

- name: Install the Traefik compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../traefik/compose.yaml"
    dest: "{{ traefik_path }}/compose.yaml"
    mode: "0644"

- name: Require traefik_trusted_ips to be empty or a comma-separated IP list
  ansible.builtin.assert:
    that:
      - traefik_trusted_ips is match('^$|^[0-9A-Fa-f.:]+(/[0-9]{1,3})?(,[0-9A-Fa-f.:]+(/[0-9]{1,3})?)*$')
    fail_msg: "traefik_trusted_ips must be empty or a comma-separated list of IPs or CIDRs."

- name: Set TRAEFIK_TRUSTED_IPS in the Traefik env file
  ansible.builtin.lineinfile:
    path: "{{ traefik_path }}/.env"
    regexp: '^TRAEFIK_TRUSTED_IPS='
    line: "TRAEFIK_TRUSTED_IPS={{ traefik_trusted_ips }}"
    create: true
    mode: "0644"
  when: traefik_trusted_ips | length > 0

- name: Check the Traefik env file
  ansible.builtin.stat:
    path: "{{ traefik_path }}/.env"
  register: traefik_env

- name: Remove TRAEFIK_TRUSTED_IPS when unset
  ansible.builtin.lineinfile:
    path: "{{ traefik_path }}/.env"
    regexp: '^TRAEFIK_TRUSTED_IPS='
    state: absent
  when:
    - traefik_trusted_ips | length == 0
    - traefik_env.stat.exists

- name: Check that docker compose is available
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false

- name: Start Traefik
  ansible.builtin.command:
    argv: "{{ traefik_compose_argv }}"
    chdir: "{{ traefik_path }}"
  vars:
    traefik_compose_argv_base:
      - docker
      - compose
    traefik_compose_argv_env:
      - --env-file
      - "{{ traefik_path }}/.env"
    traefik_compose_argv_up:
      - up
      - -d
    traefik_compose_argv: "{{ traefik_compose_argv_base + (traefik_compose_argv_env if traefik_env.stat.exists else []) + traefik_compose_argv_up }}"
