---
# Documentation host only. 192.0.2.10 is TEST-NET-1 and is not a real server.
# Restore the real inventory from KeePass to inventory/local.yml (gitignored)
# and pass that file with -i. Do not commit it.
all:
  hosts:
    bedarf.example.com:
      ansible_host: 192.0.2.10
      ansible_user: user
      ansible_port: 22
      app_domain: bedarf.example.com
      git_ref: v1.2.3
      # Defaults if omitted:
      # deploy_path: /home/user/solawi-bedarf
      # Omit deploy_path to use /home/<user>/solawi-bedarf, or
      # /home/<user>/<instance_name> when instance_name is set.
      # instance_name: ""
      # Omit instance_name for the only stack on a machine. Cron comments and the
      # Traefik router stay solawi-bedarf, and host ports stay published.
      # A second checkout sets a token such as bedarftest. That records
      # .deploy-instance in the checkout and does not publish host ports.
      # instance_name: bedarftest
      # publish_host_ports: true
      # database_external_port: 5533
      # backend_external_port: 3101
      # php_external_port: 8181
      # frontend_external_port: 8185
      # traefik_path: /home/user/traefik
      # traefik_network: traefik
      # traefik_entrypoint: web
      # traefik_trusted_ips: 192.0.2.1
      # Offsite backup. Omit all three required keys to leave it unconfigured.
      # backup_age_recipient is the public line from `age-keygen -y identity.txt`.
      # Keep the private identity in KeePass, off the server.
      backup_age_recipient: age1example
      backup_nextcloud_webdav_url: https://cloud.example/public.php/webdav
      backup_nextcloud_share_token: example-share-token
      # backup_nextcloud_share_password: ""
      # backup_offsite_extra_files: "/home/user/traefik/.env"
      # backup_max_dump_age_seconds: 21600
      # backup_offsite_retry_keep: 7
